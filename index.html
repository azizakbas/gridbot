<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Grid Bot</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="ikon.svg">
<link rel="icon" href="ikon.svg">
<meta name="theme-color" content="#111110">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!--
================================================================================
 GRID BOT — TELEFON AÇILIŞI (acilis.html)                             v3.3.52
================================================================================
 NEDEN VAR: trycloudflare adresi her tünel açılışında DEĞİŞİR. Telegram'daki
 link birkaç saat sonra ölü bir bağlantıdır; telefonda ana ekrana eklenen
 sabit bir kısayol da aynı sebeple çalışmaz. Bu sayfa o sorunun çözümü:

   SABİT adres  →  bu sayfa  →  açılışta GÜNCEL linki Supabase'den okur

 Ana ekrana eklenince (Chrome ▸ ⋮ ▸ "Ana ekrana ekle") kendi ikonuyla,
 tarayıcı çubuğu olmadan açılır — telefonda bir uygulamadan farkı yoktur.

 İKİ DÜĞME: PANEL (mobil panel) ve FİLO (dashboard). İkisi de AYNI tünelden
 gelir; dashboard.html verisini panelin proxy'sinden çeker (v3.2.5 fail-secure
 kuralı: service_role anahtarı tarayıcıya asla inmez). Bu yüzden burada tek
 bir kök adres yeter.

 AĞ YOKKEN DE AÇILIR: en son bilinen linkler telefonun kendi deposunda durur.
 Supabase'e ulaşılamazsa düğmeler o linklerle çalışır, üstünde "kaç dakikalık"
 olduğu yazar. Bayat link, hiç link olmamasından iyidir — ama YALAN SÖYLEMEZ.

 NEREDE DURUR: GitHub Pages gibi HTML sunabilen herhangi bir yerde. Supabase
 Storage OLMAZ — HTML'i bilerek text/plain'e çevirir (Edge Functions de öyle),
 yani sayfa render edilmez, kaynağı görünür. Bu ölçülerek öğrenildi (v3.3.52).

 GÜVENLİK — SIR SAYFADA DEĞİL: sayfa herkese açık durabilir, çünkü içinde
 hiçbir şey yok. Supabase proje kodu ve gizli yol, adresin # kısmında taşınır:

     https://<kullanici>.github.io/<depo>/#<proje-ref>/<gizli-yol>

 O adres yalnız SENİN telefonundaki kısayolda durur. Sayfayı başkası açarsa
 "kurulum gerekli" görür, hiçbir şey öğrenemez. İlk açılışta ayar telefonun
 deposuna yazılır; ana ekrandan # olmadan açılsa bile çalışmaya devam eder.
================================================================================
-->

<style>
:root{
  --ink:#0b0b0b; --ink2:#52514e; --ink3:#8a8985;
  --yuzey:#fcfcfb; --kart:#ffffff; --cizgi:#e6e5e1;
  --mavi:#2a78d6; --mavi-ac:#eaf2fd;
  --mor:#6b4fd6; --mor-ac:#f0ecfd;
  --kehribar:#b87d00; --kehribar-ac:#fdf0d0;
  --kirmizi:#c93636; --kirmizi-ac:#fadfdf;
  --yesil:#1f8a4c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#f4f3f0; --ink2:#b9b7b2; --ink3:#8a8985;
    --yuzey:#111110; --kart:#1b1b1a; --cizgi:#2e2e2c;
    --mavi:#6ea8f0; --mavi-ac:#16283f;
    --mor:#a58cf0; --mor-ac:#241d3d;
    --kehribar:#e0a83a; --kehribar-ac:#3a2c0d;
    --kirmizi:#f08383; --kirmizi-ac:#3a1a1a;
    --yesil:#5fc98a;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--yuzey);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
body{min-height:100svh;display:flex;flex-direction:column;
  padding:max(18px,env(safe-area-inset-top)) 18px
          max(18px,env(safe-area-inset-bottom))}

header{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
h1{font-size:19px;margin:0;letter-spacing:-.2px}
#surum{font-size:12px;color:var(--ink3)}

#hal{display:flex;align-items:center;gap:8px;font-size:13px;
  color:var(--ink2);margin:10px 0 18px;min-height:20px}
#nokta{width:9px;height:9px;border-radius:50%;background:var(--ink3);
  flex:0 0 auto}
#nokta.taze{background:var(--yesil)}
#nokta.bayat{background:var(--kehribar)}
#nokta.yok{background:var(--kirmizi)}
#nokta.ariyor{animation:nabiz 1.1s ease-in-out infinite}
@keyframes nabiz{0%,100%{opacity:1}50%{opacity:.25}}

main{display:flex;flex-direction:column;gap:14px;flex:1}

/* İki düğme ekranı PAYLAŞIR: telefonda başparmakla ıskalanmayacak kadar
   büyük olsunlar, altta ölü boşluk kalmasın. */
a.dugme{display:flex;align-items:center;gap:18px;text-decoration:none;
  background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;
  padding:22px 20px;color:var(--ink);
  flex:1 1 0;min-height:120px;
  -webkit-tap-highlight-color:transparent;transition:transform .08s ease}
a.dugme:active{transform:scale(.985)}
a.dugme[aria-disabled="true"]{opacity:.45;pointer-events:none}
.ikon{width:60px;height:60px;border-radius:17px;flex:0 0 auto;
  display:grid;place-items:center}
.ikon svg{width:31px;height:31px}
#panel .ikon{background:var(--mavi-ac);color:var(--mavi)}
#filo  .ikon{background:var(--mor-ac); color:var(--mor)}
.yazi{min-width:0}
/* span'ler VARSAYILAN OLARAK satır içidir: ad ile alt açıklama yan yana
   akıp tek paragraf gibi görünüyordu. İkisi de kendi satırında olmalı. */
.ad,.alt{display:block}
.ad{font-size:22px;font-weight:680;letter-spacing:-.3px;line-height:1.2}
.alt{font-size:13.5px;color:var(--ink2);margin-top:5px;line-height:1.35}
.ok{margin-left:auto;color:var(--ink3);font-size:22px;flex:0 0 auto}

#uyari{display:none;flex:0 0 auto;background:var(--kehribar-ac);color:var(--kehribar);
  border-radius:14px;padding:13px 15px;font-size:13.5px;line-height:1.45}
#uyari.goster{display:block}
#uyari.kotu{background:var(--kirmizi-ac);color:var(--kirmizi)}

footer{margin-top:18px;display:flex;align-items:center;gap:12px;
  font-size:12.5px;color:var(--ink3)}
button#yenile{font:inherit;font-size:13px;color:var(--ink2);
  background:var(--kart);border:1px solid var(--cizgi);border-radius:11px;
  padding:9px 15px;-webkit-tap-highlight-color:transparent}
button#yenile:active{background:var(--cizgi)}
#kurulum{margin-left:auto;text-align:right;max-width:56%}
</style>
</head>
<body>

<header>
  <h1>Grid Bot</h1>
  <span id="surum"></span>
</header>

<div id="hal"><span id="nokta" class="ariyor"></span><span id="halyazi">Güncel adres aranıyor…</span></div>

<main>
  <a class="dugme" id="panel" aria-disabled="true" href="#">
    <span class="ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
      stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2.6"/>
      <path d="M10 18.6h4"/></svg></span>
    <span class="yazi">
      <span class="ad">PANEL</span>
      <span class="alt">Ayarlar, pozisyonlar, kumanda</span>
    </span>
    <span class="ok" aria-hidden="true">›</span>
  </a>

  <a class="dugme" id="filo" aria-disabled="true" href="#">
    <span class="ikon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
      stroke-linejoin="round"><circle cx="12" cy="12" r="3"/>
      <path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3"/>
      <path d="M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1"/>
      </svg></span>
    <span class="yazi">
      <span class="ad">FİLO</span>
      <span class="alt">Dört botun durumu tek ekranda</span>
    </span>
    <span class="ok" aria-hidden="true">›</span>
  </a>

  <div id="uyari"></div>
</main>

<footer>
  <button id="yenile" type="button">Adresi yenile</button>
  <span id="kurulum"></span>
</footer>

<script>
"use strict";

/* AYAR SAYFADA DEĞİL, ADRESTE. Bu dosya herkese açık bir yerde durabilir;
   Supabase proje kodu ve gizli yol adresin # kısmından gelir ve telefonun
   deposuna yazılır. Böylece sayfayı yayınlamak hiçbir şeyi ifşa etmez. */
const KOVA   = "panel";
const DEPO   = "gridbot.linkler";
const AYAR   = "gridbot.ayar";

function ayarOku(){
  const h = (location.hash || "").replace(/^#/, "").trim();
  const m = h.match(/^([a-z0-9-]{8,})\/([0-9a-f]{16,64})$/i);
  if(m){
    const a = {ref: m[1], yol: m[2]};
    try { localStorage.setItem(AYAR, JSON.stringify(a)); } catch(e){}
    return a;
  }
  try { return JSON.parse(localStorage.getItem(AYAR) || "null"); }
  catch(e){ return null; }
}

function linkJsonUrl(a){
  return "https://" + a.ref + ".supabase.co/storage/v1/object/public/"
       + KOVA + "/" + a.yol + "/link.json";
}
const BAYAT_DK = 20;           /* tünel bundan eskiyse uyarı çıkar */

const $ = (s) => document.querySelector(s);

/* --- telefon deposu: kırılgan olabilir, ASLA sayfayı düşürmesin --------- */
function depoOku(){
  try { return JSON.parse(localStorage.getItem(DEPO) || "null"); }
  catch(e){ return null; }
}
function depoYaz(v){
  try { localStorage.setItem(DEPO, JSON.stringify(v)); } catch(e){}
}

function dakika(iso){
  const t = Date.parse(iso || "");
  if(!isFinite(t)) return null;
  return Math.max(0, Math.round((Date.now() - t) / 60000));
}
function yas(dk){
  if(dk === null) return "yaşı bilinmiyor";
  if(dk < 1)   return "az önce";
  if(dk < 60)  return dk + " dakika önce";
  const s = Math.floor(dk / 60);
  if(s < 24) return s + " saat önce";
  return Math.floor(s / 24) + " gün önce";
}

function hal(sinif, yazi){
  $("#nokta").className = sinif;
  $("#halyazi").textContent = yazi;
}
function uyar(metin, kotu){
  const u = $("#uyari");
  u.textContent = metin || "";
  u.className = metin ? ("goster" + (kotu ? " kotu" : "")) : "";
}

function dugmeleriKur(v){
  for(const [id, alan] of [["#panel","panel"], ["#filo","filo"]]){
    const a = $(id), url = v && v[alan];
    if(url){ a.href = url; a.setAttribute("aria-disabled","false"); }
    else   { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); }
  }
  $("#surum").textContent = v && v.surum ? "v" + v.surum : "";
}

/* --- ekranı TEK yerden çiz: "ne biliyoruz + ne kadar taze" ------------- */
function goster(v, kaynak){
  if(!v){
    dugmeleriKur(null);
    hal("yok", "Adres bulunamadı");
    uyar("Telefon Supabase'e ulaşamadı ve daha önce kaydedilmiş bir adres "
       + "de yok. Bilgisayarda tünel açık mı? (grid.bat ▸ Bot + Panel)", true);
    return;
  }
  dugmeleriKur(v);
  const dk = dakika(v.saat);
  const bayat = dk === null || dk > BAYAT_DK;

  if(kaynak === "ag" && !bayat){
    hal("taze", "Adres güncel · " + yas(dk));
    uyar("");
  } else if(kaynak === "ag"){
    hal("bayat", "Adres " + yas(dk) + " yazılmış");
    uyar("Tünel " + yas(dk) + " haber vermiş. Bilgisayar kapandıysa ya da "
       + "tünel yenilendiyse bu link ölmüş olabilir — düğme açılmazsa "
       + "“Adresi yenile”.");
  } else {
    hal("bayat", "Çevrimdışı · kayıtlı adres (" + yas(dk) + ")");
    uyar("Supabase'e ulaşılamadı, telefonda kayıtlı son adres kullanılıyor.");
  }
}

/* --- güncel linki çek -------------------------------------------------- */
async function cek(elle){
  const kayit = depoOku();
  if(kayit) goster(kayit, "depo");      /* önce elde olanı göster, sonra tazele */
  if(elle) hal("ariyor", "Güncel adres aranıyor…");

  const ayar = ayarOku();
  if(!ayar){
    goster(null);
    hal("yok", "Kurulum gerekli");
    uyar("Bu sayfa tek başına hiçbir şey bilmez — panelin adresi telefonundaki "
       + "kısayolun içinde taşınır. Bilgisayarda: grid.bat ▸ Araclar ▸ telefon "
       + "komutunu çalıştır, verdiği tam adresi telefonda aç.", true);
    return;
  }
  try{
    const r = await fetch(linkJsonUrl(ayar) + "?t=" + Date.now(),
                          {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const v = await r.json();
    if(!v || !v.panel) throw new Error("içerik boş");
    depoYaz(v);
    goster(v, "ag");
  }catch(e){
    if(kayit) goster(kayit, "depo");
    else{
      goster(null);
      uyar("Adres okunamadı: " + (e && e.message ? e.message : e)
         + "\n\nBilgisayarda tünel hiç açılmadıysa link.json henüz yok. "
         + "grid.bat ▸ Bot + Panel", true);
    }
  }
}

$("#yenile").addEventListener("click", () => cek(true));
/* uygulama arkadan öne gelince linki tazele — tünel bu arada yenilenmiş olabilir */
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible") cek(false);
});

(function(){
  const a = ayarOku();
  $("#kurulum").textContent = a ? (a.yol.slice(0, 6) + "…") : "";
})();
cek(false);
</script>
</body>
</html>
